syntax = "proto3";

package radar;

service RadarService {
    rpc SetSystemParams(SystemParams) returns (Status);
    rpc GetSystemParams(Empty) returns (SystemParams);

    rpc SetWaveformParams(WaveformParams) returns (Status);
    rpc GetWaveformParams(Empty) returns (WaveformParams);

    rpc SetAntennaParams(AntennaParams) returns (Status);
    rpc GetAntennaParams(Empty) returns (AntennaParams);

    rpc SetMechScanParams(MechScanParams) returns (Status);
    rpc GetMechScanParams(Empty) returns (MechScanParams);

    rpc SetNoiseParams(NoiseParams) returns (Status);
    rpc GetNoiseParams(Empty) returns (NoiseParams);

    rpc SetClutterParams(ClutterParams) returns (Status);
    rpc GetClutterParams(Empty) returns (ClutterParams);

    rpc AddTarget(TargetParams) returns (Status);
    rpc RemoveTarget(IntValue) returns (Status);
    rpc ClearTargets(Empty) returns (Status);
    rpc GetTargets(Empty) returns (TargetListResponse);

    rpc ValidateAll(Empty) returns (ValidationResult);
    rpc StartSimulation(Empty) returns (Status);
    rpc StopSimulation(Empty) returns (Status);
    rpc GetStatus(Empty) returns (SimStatus);
    rpc GetMetrics(Empty) returns (SimMetrics);
    rpc StreamMetrics(Empty) returns (stream SimMetrics);
    rpc StreamRangeProfile(Empty) returns (stream RangeProfilePreviewMsg);
    rpc StreamPpiPreview(Empty) returns (stream PpiPreviewMsg);
}

message Empty {}

message IntValue {
    int32 value = 1;
}

message Status {
    bool success = 1;
    string message = 2;
}

message ValidationResult {
    bool valid = 1;
    repeated string errors = 2;
}

message SimStatus {
    enum State {
        IDLE = 0;
        RUNNING = 1;
        STOPPED = 2;
        FINISHED = 3;
    }
    State state = 1;
    double progress = 2;
    int32 current_scan = 3;
    int32 total_scans = 4;
}

message SimMetrics {
    uint32 current_scan = 1;
    uint64 current_pulse = 2;
    uint64 total_pulses = 3;
    double progress_percent = 4;
    double avg_us_per_prt = 5;
    double realtime_ratio = 6;
    double target_us = 7;
    double clutter_us = 8;
    double noise_us = 9;
    double compose_us = 10;
    double output_us = 11;
    double preview_us = 12;
    uint64 frames_output = 13;
    uint64 dropped_preview_frames = 14;
}

message RangeProfilePreviewMsg {
    uint64 pulse_index = 1;
    double beam_az_deg = 2;
    repeated float power_db = 3;
}

message PpiPreviewMsg {
    uint32 scan_index = 1;
    int32 range_bins = 2;
    int32 az_bins = 3;
    double dynamic_range_db = 4;
    bytes image = 5;
}

message SystemParams {
    double fc_hz = 1;
    double prf_hz = 2;
    double bandwidth_hz = 3;
    double pulse_width_s = 4;
    double fs_hz = 5;
    double min_range_m = 6;
    double max_range_m = 7;
    int32 scan_count = 8;
    double peak_power_w = 9;
}

message WaveformParams {
    enum WaveformType {
        LFM = 0;
        PHASE_CODE = 1;
        NLFM = 2;
        STARE = 3;
    }
    WaveformType waveform_type = 1;
    int32 phase_code_type = 2;
    int32 nlfm_window_type = 3;
    int32 polarization = 4;
}

message AntennaParams {
    double az_beamwidth_deg = 1;  // 方位维 3dB 波束宽度（度）
    double el_beamwidth_deg = 2;  // 俯仰维 3dB 波束宽度（度）
    double peak_gain_db = 3;      // 峰值增益（dB）
}

message MechScanParams {
    double rotation_rate_dps = 1;  // 天线转速（度/秒）
    double az_start_deg = 2;       // 有效扫描起始方位角（度）
    double az_end_deg = 3;         // 有效扫描终止方位角（度）
    double elevation_deg = 4;      // 固定俯仰角（度）
}

message NoiseParams {
    enum NoiseMode {
        DISABLED = 0;
        COMPLEX_GAUSSIAN = 1;
        RECEIVER_TEMP = 2;
        SNR = 3;
    }
    NoiseMode mode = 1;
    double sigma_complex = 2;
    double temperature_k = 3;
    double noise_power_w = 4;
    double noise_bandwidth_hz = 5;
    int32 seed = 6;
}

// 杂波地图参数
message ClutterParams {
    enum ClutterDistribution {
        RAYLEIGH = 0;
        WEIBULL = 1;
        LOG_NORMAL = 2;
        K_DISTRIBUTION = 3;
    }
    bool enabled = 1;
    double sea_state = 2;        // 海况等级
    double doppler_center_hz = 3;        // 多普勒谱中心（Hz）
    double doppler_sigma_hz = 4;         // 多普勒谱标准差（Hz）
    double ground_range_min_m = 5;       // 地距下限（m）
    double ground_range_max_m = 6;       // 地距上限（m）
    int32 seed = 7;                      // 随机种子
    double az_patch_step_deg = 8;        // 海面方位 patch 网格步长（度）
    double active_gain_floor_db = 9;     // 活动窗口截断门限（相对峰值功率 dB）
    ClutterDistribution distribution = 10; // 幅度分布
    double weibull_shape = 11;           // Weibull 形状参数 p
    double weibull_scale = 12;           // Weibull 尺度参数 q
    double lognormal_mu = 13;            // ln(幅度) 均值
    double lognormal_sigma = 14;         // ln(幅度) 标准差
    double k_shape_nu = 15;              // K 分布 Gamma texture 形状参数
    double k_texture_bandwidth_hz = 16;  // K 分布 texture AR(1) 带宽
    int32 k_lut_size = 17;               // K 分布 z->sqrt(tau) LUT 长度
}

message TargetParams {
    int32 id = 1;
    double range_m = 2;
    double azimuth_deg = 3;
    double elevation_deg = 4;
    double radial_velocity_ms = 5;
    double rcs_db = 6;
    int32 swerling_type = 7;
}

message TargetListResponse {
    repeated TargetParams targets = 1;
}
