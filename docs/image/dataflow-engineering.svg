<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1500 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="dataArrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#3498db"/>
    </marker>
    <linearGradient id="inputBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <linearGradient id="processBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#8e44ad"/>
    </linearGradient>
    <linearGradient id="outputBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60"/>
      <stop offset="100%" style="stop-color:#1e8449"/>
    </linearGradient>
    <linearGradient id="dataBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#d68910"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="1100" fill="#f5f6fa"/>

  <!-- Title -->
  <text x="750" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">
    Radar 回波仿真系统 - 数据流转图（工程实现视角）
  </text>

  <!-- ====== PHASE 1: 初始化 ====== -->
  <g id="phase1">
    <rect x="50" y="60" width="1400" height="180" rx="10" fill="#eaf2f8" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="80" y="85" font-size="14" font-weight="bold" fill="#2980b9">▶ 阶段 1: 初始化 (Initialization)</text>

    <!-- Config File -->
    <rect x="80" y="100" width="200" height="50" rx="5" fill="url(#inputBox)" stroke="#2980b9"/>
    <text x="180" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="white">config/radar_config.json</text>
    <text x="180" y="138" text-anchor="middle" font-size="10" fill="#e0e0e0">JSON 配置文件</text>

    <!-- Arrow -->
    <line x1="280" y1="125" x2="320" y2="125" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

    <!-- ConfigurationManager -->
    <rect x="330" y="100" width="220" height="70" rx="5" fill="url(#processBox)" stroke="#8e44ad"/>
    <text x="440" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ConfigurationManager</text>
    <text x="440" y="145" text-anchor="middle" font-size="10" fill="#e8daef">load_from_json() · validate() · print()</text>
    <text x="440" y="160" text-anchor="middle" font-size="10" fill="#e8daef">compute_derived_params()</text>

    <!-- Arrow -->
    <line x1="550" y1="135" x2="590" y2="135" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

    <!-- RadarConfig Object -->
    <rect x="600" y="100" width="180" height="70" rx="5" fill="#f7dc6f" stroke="#f1c40f" stroke-width="2"/>
    <text x="690" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">RadarConfig 对象</text>
    <text x="690" y="145" text-anchor="middle" font-size="9" fill="#555">• system: fc/prf/bw/脉宽/功率</text>
    <text x="690" y="160" text-anchor="middle" font-size="9" fill="#555">• waveform/antenna/target/clutter/noise</text>

    <!-- Arrow down to engine -->
    <line x1="690" y1="170" x2="690" y2="200" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

    <!-- SimulationEngine Construction -->
    <rect x="500" y="200" width="380" height="40" rx="5" fill="#d2b4de" stroke="#8e44ad"/>
    <text x="690" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">SimulationEngine engine(config)</text>

    <!-- Initialize arrow -->
    <line x1="690" y1="240" x2="690" y2="265" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

    <!-- Engine Initialize -->
    <rect x="520" y="265" width="340" height="60" rx="5" fill="url(#processBox)" stroke="#8e44ad"/>
    <text x="690" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="white">engine.initialize()</text>
    <text x="690" y="310" text-anchor="middle" font-size="10" fill="#e8daef">初始化：WaveformGenerator · BeamScanner · TargetEngine</text>
    <text x="690" y="325" text-anchor="middle" font-size="10" fill="#e8daef">ClutterEngine · NoiseEngine · DataExporter · UdpSender</text>
  </g>

  <!-- ====== PHASE 2: 仿真主循环 ====== -->
  <g id="phase2">
    <rect x="50" y="250" width="1400" height="520" rx="10" fill="#fdedec" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="80" y="275" font-size="14" font-weight="bold" fill="#c0392b">▶ 阶段 2: 仿真主循环 (Scan Loop)</text>

    <!-- Scan Loop Start -->
    <rect x="80" y="290" width="200" height="50" rx="25" fill="#e74c3c" stroke="#c0392b"/>
    <text x="180" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="white">for scan = 0 to N_scans</text>
    <text x="180" y="332" text-anchor="middle" font-size="9" fill="#fadbd8">外循环：扫描序号</text>

    <!-- Arrow -->
    <path d="M280 315 L320 315" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

    <!-- Create ScanData -->
    <rect x="330" y="290" width="180" height="50" rx="5" fill="#f5b7b1" stroke="#e74c3c"/>
    <text x="420" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">ScanData scan_data</text>
    <text x="420" y="332" text-anchor="middle" font-size="9" fill="#666">收集当前扫描回波</text>

    <!-- Arrow down to CPI loop -->
    <path d="M420 340 L420 370" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

    <!-- CPI Loop -->
    <rect x="280" y="370" width="280" height="50" rx="25" fill="#f1948a" stroke="#c0392b"/>
    <text x="420" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="white">for cpi = 0 to beams_per_scan</text>
    <text x="420" y="412" text-anchor="middle" font-size="9" fill="#fadbd8">内循环：CPI/波束序号</text>

    <!-- Arrow to CPI processing -->
    <path d="M420 420 L420 455" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

    <!-- ====== CPI Processing Steps ====== -->
    <g id="cpi-processing">
      <!-- Step 1: Get Beam Pointing -->
      <rect x="100" y="455" width="240" height="55" rx="5" fill="url(#processBox)" stroke="#8e44ad"/>
      <text x="220" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">① BeamScanner::get_current_beam()</text>
      <text x="220" y="500" text-anchor="middle" font-size="9" fill="#e8daef">输出：azimuth_deg, elevation_deg</text>

      <!-- Step 2: Update Targets -->
      <rect x="360" y="455" width="240" height="55" rx="5" fill="url(#processBox)" stroke="#8e44ad"/>
      <text x="480" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">② TargetManager.update_to_time(t)</text>
      <text x="480" y="500" text-anchor="middle" font-size="9" fill="#e8daef">外推目标位置/速度</text>

      <!-- Step 3: Generate Waveform -->
      <rect x="620" y="455" width="240" height="55" rx="5" fill="url(#processBox)" stroke="#8e44ad"/>
      <text x="740" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">③ WaveformGenerator.generate()</text>
      <text x="740" y="500" text-anchor="middle" font-size="9" fill="#e8daef">LFM: s(t) = exp(j2π(fct+0.5μt²))</text>

      <!-- Step 4: Target Echo -->
      <rect x="880" y="455" width="240" height="55" rx="5" fill="url(#processBox)" stroke="#8e44ad"/>
      <text x="1000" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="white">④ TargetEngine.generate()</text>
      <text x="1000" y="500" text-anchor="middle" font-size="9" fill="#e8daef">TargetEchoSynthesizer::synthesize()</text>

      <!-- Arrow down to more steps -->
      <path d="M1000 510 L1000 545" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

      <!-- Step 5: Clutter Echo -->
      <rect x="880" y="545" width="240" height="55" rx="5" fill="url(#processBox)" stroke="#8e44ad"/>
      <text x="1000" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="white">⑤ ClutterEngine.generate()</text>
      <text x="1000" y="590" text-anchor="middle" font-size="9" fill="#e8daef">SeaClutterModel::compute_rcs() + IFFT</text>

      <!-- Step 6: Noise -->
      <rect x="620" y="545" width="240" height="55" rx="5" fill="url(#processBox)" stroke="#8e44ad"/>
      <text x="740" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="white">⑥ NoiseEngine.generate()</text>
      <text x="740" y="590" text-anchor="middle" font-size="9" fill="#e8daef">n ~ CN(0, σ²)</text>

      <!-- Step 7: Combine -->
      <rect x="360" y="545" width="240" height="55" rx="5" fill="#1abc9c" stroke="#16a085"/>
      <text x="480" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="white">⑦ 回波叠加</text>
      <text x="480" y="590" text-anchor="middle" font-size="9" fill="#e8f8f5">y_rx = y_target + y_clutter + y_noise</text>

      <!-- Step 8: Collect -->
      <rect x="100" y="545" width="240" height="55" rx="5" fill="#f39c12" stroke="#d68910"/>
      <text x="220" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="white">⑧ scan_data.add_cpi_echo()</text>
      <text x="220" y="590" text-anchor="middle" font-size="9" fill="#fef5e7">收集到 CpiEcho 结构</text>
    </g>

    <!-- Loop back arrow -->
    <path d="M420 600 L420 630 L300 630 L300 440" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)" fill="none"/>

    <!-- Exit CPI loop arrow -->
    <path d="M560 600 L650 600" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>

  <!-- ====== PHASE 3: 数据输出 ====== -->
  <g id="phase3">
    <rect x="50" y="780" width="1400" height="280" rx="10" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="80" y="805" font-size="14" font-weight="bold" fill="#229954">▶ 阶段 3: 数据输出 (Export)</text>

    <!-- Export trigger -->
    <rect x="680" y="820" width="140" height="50" rx="5" fill="#f39c12" stroke="#d68910"/>
    <text x="750" y="845" text-anchor="middle" font-size="11" font-weight="bold" fill="white">scan 完成</text>
    <text x="750" y="862" text-anchor="middle" font-size="9" fill="#666">触发导出</text>

    <!-- Arrows split -->
    <path d="M750 870 L750 900 L450 900 L450 925" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>
    <path d="M750 870 L750 900 L750 925" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>
    <path d="M750 870 L750 900 L1050 900 L1050 925" stroke="#e74c3c" stroke-width="2" marker-end="url(#flowArrow)"/>

    <!-- DataExporter -->
    <rect x="250" y="925" width="400" height="120" rx="10" fill="url(#outputBox)" stroke="#1e8449"/>
    <text x="450" y="955" text-anchor="middle" font-size="14" font-weight="bold" fill="white">DataExporter::export_scan()</text>

    <rect x="280" y="970" width="340" height="25" rx="3" fill="#fff" stroke="#27ae60"/>
    <text x="450" y="987" text-anchor="middle" font-size="10" fill="#333">export_echo_iq_dat() → data/iq_scan_0.dat</text>

    <rect x="280" y="1000" width="340" height="25" rx="3" fill="#fff" stroke="#27ae60"/>
    <text x="450" y="1017" text-anchor="middle" font-size="10" fill="#333">export_target_snapshots() → data/targets_scan_0.csv</text>

    <!-- UdpSender -->
    <rect x="650" y="925" width="300" height="120" rx="10" fill="url(#outputBox)" stroke="#1e8449"/>
    <text x="800" y="955" text-anchor="middle" font-size="14" font-weight="bold" fill="white">UdpSender::send()</text>
    <text x="800" y="980" text-anchor="middle" font-size="11" fill="#e8f8f5">发送 IQ 数据包</text>
    <text x="800" y="1005" text-anchor="middle" font-size="11" fill="#e8f8f5">目标：127.0.0.1:9000</text>
    <text x="800" y="1030" text-anchor="middle" font-size="10" fill="#d0f0e8">可选启用 (config.system.udp_output.enabled)</text>

    <!-- Log output -->
    <rect x="980" y="925" width="320" height="120" rx="10" fill="#f9e79f" stroke="#f1c40f"/>
    <text x="1140" y="955" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">spdlog 日志</text>
    <text x="1140" y="980" text-anchor="middle" font-size="10" fill="#555">• 控制台 (彩色)</text>
    <text x="1140" y="1000" text-anchor="middle" font-size="10" fill="#555">• 文件：out/log/radar_sim.log</text>
    <text x="1140" y="1020" text-anchor="middle" font-size="10" fill="#555">• 级别：INFO/DEBUG</text>
  </g>

  <!-- ====== Data Structures Legend ====== -->
  <g id="data-legend">
    <rect x="1100" y="60" width="320" height="170" rx="10" fill="#fff" stroke="#3498db" stroke-width="2"/>
    <text x="1260" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">📦 关键数据结构</text>

    <rect x="1120" y="95" width="280" height="30" rx="3" fill="#f7dc6f" stroke="#f1c40f"/>
    <text x="1135" y="115" font-size="9" fill="#333">RadarConfig - 总配置容器 (所有子模块配置)</text>

    <rect x="1120" y="130" width="280" height="30" rx="3" fill="#f7dc6f" stroke="#f1c40f"/>
    <text x="1135" y="150" font-size="9" fill="#333">TargetState - 目标状态 (id/位置/速度/RCS)</text>

    <rect x="1120" y="165" width="280" height="30" rx="3" fill="#f7dc6f" stroke="#f1c40f"/>
    <text x="1135" y="185" font-size="9" fill="#333">PulseEcho = vector&lt;Complex&gt; - 单脉冲回波</text>

    <rect x="1120" y="200" width="280" height="30" rx="3" fill="#f7dc6f" stroke="#f1c40f"/>
    <text x="1135" y="220" font-size="9" fill="#333">CpiEcho - CPI 回波 (多脉冲 + 波位信息)</text>

    <text x="1120" y="250" font-size="9" fill="#333">Complex = std::complex&lt;double&gt;</text>
    <text x="1120" y="265" font-size="9" fill="#333">GeoCoord - 地理坐标 (lat/lon/alt)</text>
    <text x="1120" y="280" font-size="9" fill="#333">AzEl - 方位/俯仰角</text>
  </g>

  <!-- ====== Timing Info ====== -->
  <g id="timing">
    <rect x="1100" y="240" width="320" height="130" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
    <text x="1260" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">⏱️ 时序参数 (默认配置)</text>

    <text x="1120" y="290" font-size="10" fill="#333">载频 fc: 10 GHz</text>
    <text x="1120" y="308" font-size="10" fill="#333">PRF: 1.6 kHz (T = 625 μs)</text>
    <text x="1120" y="326" font-size="10" fill="#333">带宽 BW: 25 MHz</text>
    <text x="1120" y="344" font-size="10" fill="#333">脉宽 τ: 2 μs</text>
    <text x="1120" y="362" font-size="10" fill="#333">采样率 fs: 60 MHz</text>

    <text x="1120" y="385" font-size="10" fill="#e74c3c" font-weight="bold">pulses_per_cpi: 32</text>
    <text x="1120" y="403" font-size="9" fill="#666">CPI 时长：32/1600 = 20 ms</text>
  </g>
</svg>